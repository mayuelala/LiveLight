# Template config for paired 40+40 Stage 3 training.
# Expected per-sequence frame layout:
# - 0000..0039: reference/original video
# - 0040..0079: relit target video
#
# The current older f41 stage3_data root (1+40) does not satisfy this layout.

data:
  train_bs: 1
  train_width: 512
  train_height: 512
  num_workers: 8
  image_root: ./data/stage3_data/image
  mpli_root: ./data/stage3_data/condition
  sample_list_path: ./data/stage3_data/sample_list.txt
  n_sample_frames: 40
  max_batch_frames: 10
  reference_frame_start: 0
  target_frame_start: 40
  random_clip_start: false

model:
  light_channels: 12
  enable_multiscale_light_injection: true
  multiscale_light_injection_scale: 0.25

solver:
  gradient_accumulation_steps: 1
  mixed_precision: fp16
  enable_xformers_memory_efficient_attention: true
  gradient_checkpointing: true
  max_train_steps: 10000
  max_grad_norm: 1.0
  learning_rate: 1.0e-05
  scale_lr: false
  lr_warmup_steps: 1
  lr_scheduler: constant
  use_8bit_adam: false
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-08

loss:
  mse_weight: 1.0
  lpips_weight: 2.0

temporal_window_size: 4
temporal_adaptive_step: 4
timesteps_list: [999, 666, 333, 0]

base_model_path: ./pretrained_weights/sd-image-variations-diffusers
vae_model_path: ./pretrained_weights/sd-vae-ft-mse
image_encoder_path: ./pretrained_weights/sd-image-variations-diffusers/image_encoder
inference_config: ./configs/inference/inference_stage3.yaml

reference_unet_path: ./exp_output/relight_stage2_tmux_bs2_110k_mixed_ps50_zero_tolerance_v1_no_gan/reference_unet-110000.pth
denoising_unet_path: ./exp_output/relight_stage2_tmux_bs2_110k_mixed_ps50_zero_tolerance_v1_no_gan/denoising_unet-110000.pth
light_guider_path: ./exp_output/relight_stage2_tmux_bs2_110k_mixed_ps50_zero_tolerance_v1_no_gan/light_guider-110000.pth
temporal_module_path: ""
reset_temporal_modules: true

weight_dtype: fp16
uncond_ratio: 0.1
reference_drop_ratio: 0.0
seed: 12580

resume_from_checkpoint: ""
checkpointing_steps: 1000
preview_every_steps: 200
save_final_model: true
exp_name: relight_stage3
output_dir: ./exp_output

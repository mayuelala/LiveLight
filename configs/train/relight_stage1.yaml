data:
  train_bs: 4
  train_width: 512
  train_height: 512
  num_workers: 8
  image_root: "./data/image"
  mpli_root: "./data/condition"
  sample_list_path: "./data/sample_list.txt"
  source_frame_id: 0
  lit_frame_start: 1

model:
  light_channels: 12
  enable_multiscale_light_injection: true
  multiscale_light_injection_scale: 0.25

solver:
  gradient_accumulation_steps: 1
  mixed_precision: "fp16"
  enable_xformers_memory_efficient_attention: true
  gradient_checkpointing: false
  max_train_steps: 50000
  max_grad_norm: 1.0
  learning_rate: 1e-5
  scale_lr: false
  lr_warmup_steps: 1
  lr_scheduler: "constant"
  use_8bit_adam: false
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

base_model_path: "./pretrained_weights/sd-image-variations-diffusers"
vae_model_path: "./pretrained_weights/sd-vae-ft-mse"
image_encoder_path: "./pretrained_weights/sd-image-variations-diffusers/image_encoder"
inference_config: "./configs/inference/inference_stage1&2.yaml"

weight_dtype: "fp16"
uncond_ratio: 0.1
noise_offset: 0.05

seed: 12580
resume_from_checkpoint: ""
checkpointing_steps: 1000
save_model_epoch_interval: 1
exp_name: "relight_stage1"
output_dir: "./exp_output"
